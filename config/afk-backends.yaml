schema_version: "1.0"

# AFK backend registry.
# Each entry maps a backend name (the value passed to --backend) to the Python
# adapter class that implements the AFKBackend contract and to the AIW budget
# provider used for cost gating.
#
# The adapter path is relative to the scripts/ directory, because
# scripts/run_afk_cycle.py adds scripts/ to sys.path before loading backends.
backends:
  claude-code:
    adapter: "afk_backends.claude_code.ClaudeCodeBackend"
    provider: "claude-code-cli"
    description: "Headless Claude Code on the interactive subscription (no container)."
    enabled: true

  local:
    adapter: "afk_backends.sandcastle.SandcastleBackend"
    # Attribute a backend to the provider it ACTUALLY BILLS. This line was
    # codex-cli, then claude-code-cli (#877) -- both local-seat with
    # requires_manual_approval: false, so metered spend cleared the gate either
    # way. The description below was correct the whole time; only the value was
    # wrong. See #863.
    provider: "anthropic-api"
    description: "Podman sandcastle via the sibling ../afk-harness project. Forwards ANTHROPIC_API_KEY and runs claudeCode(opus), so it is metered Anthropic API spend and requires a manual approval artifact."
    enabled: true

  remote:
    adapter: "afk_backends.remote.RemoteBackend"
    provider: "claude-code-cli"
    description: "HTTP cloud worker (Vercel, Codespaces, or any AFK-compatible endpoint). Disabled by default until an endpoint is configured."
    enabled: false
    config:
      # endpoint: "https://example.com/afk-worker"
      # api_key_env: "DEMERZEL_REMOTE_API_KEY"
      # timeout: 300

  shell:
    adapter: "afk_backends.shell.ShellBackend"
    provider: "generic-shell"
    description: "Generic configurable shell command. Proves the AFKBackend abstraction works with any non-Claude tool that reads a JSON issue from stdin and emits a JSON result on stdout. Disabled by default until a command is configured."
    enabled: false
    config:
      # command: ["python", "my_afk_agent.py"]
      # timeout: 300
      # needs_local_repo: true
      # env:
      #   MY_AGENT_MODE: "afk"
