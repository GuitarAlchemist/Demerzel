name: staleness-detection-policy
version: "1.4.0"
effective_date: "2026-09-13"
description: Detect stale, unprocessed, or non-iterated state artifacts and prioritize their refresh. Now includes knowledge-topology lint for Streeling wiki health. Demerzel should never have blind spots about her own staleness.

constitutional_basis:
  - Article 7 (Auditability) — stale state reduces auditability
  - Article 8 (Observability) — stale metrics mislead
  - Article 9 (Bounded Autonomy) — operating on stale beliefs exceeds safe bounds

principles:
  - "A belief that is never updated is not a belief — it is an assumption"
  - "Stale state is worse than no state — it creates false confidence"
  - "The irony of a stale staleness signal is a governance failure"
  - "Detection without action is just observation — schedule the fix"

# Lifecycle scope (added 1.3.0, 2026-09-13). Up to 1.2.0 every file matching a
# category path was measured against its threshold, whatever its lifecycle. On
# 2026-09-12 a uniform 7-day sweep of state/ in that spirit counted "64 stale
# state files", which was then filed as dissent against
# cross-reference-integrity (Demerzel #1064) and had to be retired (#1065): most
# of the set was TERMINAL — conscience signals carrying a RESOLVED outcome, a
# regret with status resolved, council and trigger event records. A resolved
# record does not go stale; it is finished. The same sweep showed the opposite
# error in governance-audit-policy audit-2-6, which downgraded "evolution logs" and
# "PDCA cycles" to a 90-day, informational-only threshold as historical: state/evolution is the live metrics store that
# scripts/quality_trend.py reads nightly (frozen since 2026-07-29 while that loop
# stayed green), and a PDCA without an outcome is open work, not history.
# Staleness therefore follows the artifact's lifecycle, not its directory.
lifecycle_scope:
  principle: "Measure staleness only on artifacts that claim to describe the present or are waiting on action. A finished record is not stale."
  terminal:
    description: "Exempt from every max_staleness_days threshold. Report nothing."
    rules:
      - "Any file under an archived/ directory"
      - "state/conscience/signals/*.signal.json that carries an outcome"
      - "state/conscience/regrets/*.regret.json with status resolved"
      - "state/pdca/*.pdca.json that carries an outcome (adopted, adapted, abandoned)"
      - "Event records: state/triggers/*.trigger.json, state/council/*.json"
      - "Research-cycle logs (state/streeling/research-cycles/*.json) carrying a conclusion or reflection"
  open_work:
    description: "Measured against the category threshold. Age means work is waiting."
    rules:
      - "PDCA without an outcome — stuck in plan/do/check (see anti_pattern 'PDCA stuck in Plan')"
      - "Conscience signal without an outcome"
      - "Intuition with status candidate"
  live_state:
    description: "Measured against the category threshold. Age means the artifact may no longer describe the repository."
    rules:
      - "Beliefs (state/beliefs/*.belief.json outside archived/)"
      - "Evolution log metrics (state/evolution/*.evolution.json) — consumed by quality_trend.py and /demerzel compound; freshness is the nightly producer run (see artifact_categories freshness_source)"
      - "Indexes and catalogs that enumerate other artifacts, when an artifact_categories entry names them (none does as of 1.4.0, so none is measured)"
      - "Health scores and digests"
  age_source: "Use the last commit time touching the file (git log -1 --format=%cI -- <path>), falling back to its last_updated field. Never filesystem mtime: every clone, checkout and worktree resets it."
  rationale: "Measured on master 706e656 (2026-09-12): 64 tracked state files outside archived/ were older than 7 days. Classified under this scope: 30 terminal (5 signals with an outcome, 1 resolved regret, 5 council verdicts, 9 trigger events, 10 research-cycle logs carrying a conclusion or reflection); 12 open work (8 PDCAs, none of which then carried an outcome, and 4 candidate intuitions); 22 live state (1 belief, 18 evolution-log files, 3 indexes). Treating all 64 as one population hid both the one false belief (consumer-repo-integration-status: ga 791 commits behind) and the frozen evolution metrics under a green quality-trend loop."

# Dormant categories (added 1.4.0, 2026-09-13). The first mechanized run of this
# policy (scripts/staleness_scan.py, Demerzel #1074, master baa891e) reported 52
# stale files across 8 categories, each with nothing refreshed within threshold.
# git history shows that 7 of them never had a recurring producer: most were
# seeded once on 2026-03-17 and are otherwise written only when a skill is run by
# hand. Reporting them on every scan yields warnings nobody can act on short of
# scheduling metered LLM runs, which the owner declined. Their thresholds stay in
# artifact_categories, so reviving one is a removal from this list.
dormant_categories:
  description: "Counted by the scan, not reported as stale. Anything that reads a dormant artifact must treat it as possibly outdated and check its commit age before relying on it."
  revive_when: "A producer writes the category on a schedule or deterministically AND a consumer reads it. Remove the category from this list in the same change."
  categories:
    - category: conscience_digests
      evidence: "2 commits (2026-03-17 to 2026-03-21). Written only by /demerzel report run by hand."
    - category: conscience_weekly
      evidence: "1 commit (2026-03-17). No producer. Its only reader, demerzel-ideation, was disabled on 2026-09-13."
    - category: conscience_patterns
      evidence: "1 commit (2026-03-17). No producer. demerzel-autofix and demerzel-ideation only count the files."
    - category: intuition_signals
      evidence: "1 commit (2026-03-17). No producer and no reader found. The 4 candidate intuitions are open work that is not being worked."
    - category: health_scores
      evidence: "5 commits (2026-03-20 to 2026-03-23). Written and read only by /demerzel drive run by hand."
    - category: source_ingest_queue
      evidence: "1 commit (2026-04-05). Written only by /demerzel-harvest run by hand."
    - category: department_weights
      evidence: "20 commits (2026-03-19 to 2026-05-02). Written by Seldon research-cycle skills (LLM runs), none since."
    - category: grammar_weights
      evidence: "Same files as department_weights."

artifact_categories:
  - category: beliefs
    path: "state/beliefs/*.belief.json"
    max_staleness_days: 7
    refresh_action: "Re-evaluate belief via /seldon research or /demerzel recon"
    priority: high
    rationale: "Beliefs drive decisions. Stale beliefs drive wrong decisions."

  - category: conscience_signals
    path: "state/conscience/signals/*.signal.json"
    max_staleness_days: 3
    refresh_action: "Process signal — resolve, escalate, or archive"
    priority: critical
    rationale: "Unprocessed conscience signals are ethics violations waiting to happen."

  - category: conscience_digests
    path: "state/conscience/digests/*.digest.json"
    max_staleness_days: 1
    refresh_action: "Generate new daily digest via /demerzel report"
    priority: high
    rationale: "Daily digest should be... daily."

  - category: conscience_weekly
    path: "state/conscience/weekly/*.report.json"
    max_staleness_days: 7
    refresh_action: "Generate weekly report"
    priority: medium

  - category: conscience_patterns
    path: "state/conscience/patterns/*.pattern.json"
    max_staleness_days: 14
    refresh_action: "Re-evaluate pattern — still active? resolved?"
    priority: medium

  - category: conscience_regrets
    path: "state/conscience/regrets/*.regret.json"
    max_staleness_days: 7
    refresh_action: "Has the regret been addressed? Archive or escalate."
    priority: medium

  - category: evolution_log
    path: "state/evolution/*.evolution.json"
    max_staleness_days: 14
    # Since 1.4.0 the citation metrics are computed nightly by
    # scripts/evolution_metrics.py (demerzel-quality-trend.yml), which rewrites a
    # file only when a value changes. A stable artifact therefore keeps an old
    # commit time while its producer is alive, so file age says nothing. The run
    # itself is guarded: the producer runs before quality_trend.py in the same
    # job, and demerzel-quality-trend-freshness.yml goes red when no new
    # quality-trend line lands. The scan counts these files as produced.
    freshness_source: producer_run
    freshness_guard: ".github/workflows/demerzel-quality-trend-freshness.yml"
    refresh_action: "Re-assess artifact effectiveness via /demerzel evolve"
    priority: medium

  - category: intuition_signals
    path: "state/intuition/*.json"
    max_staleness_days: 7
    refresh_action: "Validate intuition — confirmed? disproven? still unknown?"
    priority: medium

  - category: pdca_cycles
    path: "state/pdca/*.pdca.json"
    max_staleness_days: 14
    refresh_action: "Advance PDCA cycle — stuck in Plan? stuck in Check?"
    priority: high
    rationale: "A PDCA cycle that stops cycling is just a plan that was never tested."

  - category: department_weights
    path: "state/streeling/departments/*.weights.json"
    max_staleness_days: 30
    refresh_action: "Run /seldon research-cycle for the department"
    priority: low

  - category: health_scores
    path: "state/driver/health-scores.json"
    max_staleness_days: 3
    refresh_action: "Run /demerzel drive recon"
    priority: high

  - category: grammar_weights
    path: "state/streeling/departments/*.weights.json"
    max_staleness_days: 30
    refresh_action: "Run research cycles to update grammar weights"
    priority: low
    rationale: "Per grammar-evolution-policy: >30 days = stale grammar"

  - category: source_ingest_queue
    path: "sources/index.md"
    max_staleness_days: 7
    refresh_action: "Run /demerzel-harvest to process pending sources"
    priority: medium
    rationale: "Pending sources older than 7 days mean knowledge is sitting uncompiled."

knowledge_topology_lint:
  description: "Structural health checks for the Streeling knowledge wiki. Inspired by Karpathy's LLM Wiki lint operation — find contradictions, orphans, missing cross-refs, and gaps."
  trigger: "Every /demerzel audit level 2+ and /demerzel-harvest cycle"
  constitutional_basis: "Article 8 (Observability) — a knowledge base with invisible gaps misleads"

  checks:
    - name: orphan_departments
      description: "Department exists but has zero courses and zero research cycles"
      detection: "departments/{dept}.department.json exists AND courses/{dept}/ is empty AND research-cycles/ has no entries for {dept}"
      severity: warning
      action: "Schedule /seldon research-cycle for the department"
      rationale: "A department with no output is a label, not knowledge."

    - name: orphan_courses
      description: "Course exists but is not referenced by any department index or cross-linked by any other course"
      detection: "courses/{dept}/{course}/en/*.md exists but no inbound references from other courses or department overview"
      severity: info
      action: "Add cross-references or merge into parent department overview"
      rationale: "Unlinked knowledge is unfindable knowledge."

    - name: missing_concept_pages
      description: "A concept is mentioned in 3+ courses but has no dedicated overview page"
      detection: "grep across courses/ for repeated concept names that lack a {concept}.md in the department"
      severity: info
      action: "Create concept overview page synthesizing mentions"
      rationale: "Frequently referenced concepts deserve compiled explanations."

    - name: contradiction_between_sources
      description: "Two sources or course pages make conflicting claims about the same topic"
      detection: "Cross-reference claims tagged with hexavalent C (Contradictory) in beliefs or course material"
      severity: warning
      action: "Flag for human review — resolve or document as open question"
      rationale: "Contradictions are valuable signals, not bugs — but they must be visible."

    - name: stale_department_coverage
      description: "Department weights show zero coverage growth in 30+ days"
      detection: "weights.json last_modified > 30 days AND coverage_ratio unchanged"
      severity: info
      action: "Run /seldon-auto-research targeting this department"
      rationale: "Knowledge that stops growing starts decaying."

    - name: cross_reference_density
      description: "Wiki pages should have inbound links — pages with zero inbound links are orphans"
      detection: "For each course .md file, count references to it from other .md files. Zero = orphan."
      severity: info
      action: "Add links from related pages or merge into a parent page"
      metric: "cross_ref_density = total_inbound_links / total_pages (target > 2.0)"

    - name: source_to_page_ratio
      description: "Each ingested source should touch 3+ Streeling pages on average"
      detection: "sources/index.md pages_touched column; average < 3 = shallow ingestion"
      severity: warning
      action: "Re-ingest sources with deeper cross-referencing"
      rationale: "Shallow ingestion produces summaries, not compiled knowledge."

detection_process:
  trigger: "Every driver RECON phase + daily harvest + on-demand via /demerzel audit"

  steps:
    - name: scan
      action: "Walk all state/ directories; skip dormant_categories; drop terminal records per lifecycle_scope; age the rest per lifecycle_scope.age_source (not filesystem mtime)"
      output: "List of {file, category, days_stale, max_allowed, priority}"

    - name: classify
      action: "Group stale artifacts by priority (critical > high > medium > low)"
      rules:
        - "critical: staleness > 2x max_allowed OR conscience signals"
        - "high: staleness > max_allowed AND (beliefs OR digests OR health)"
        - "medium: staleness > max_allowed AND (evolution OR patterns OR pdca)"
        - "low: staleness > max_allowed AND (weights OR other)"

    - name: schedule
      action: "Create refresh tasks in the driver cycle's PLAN phase"
      rules:
        - "critical stale items become T0 tasks (execute immediately)"
        - "high stale items become next-cycle tasks"
        - "medium stale items become backlog with deadline"
        - "low stale items are logged but not auto-scheduled"

    - name: report
      action: "Include staleness summary in governance report"
      format: |
        Staleness Report:
        - Critical: {n} items (oldest: {days} days)
        - High: {n} items
        - Medium: {n} items
        - Low: {n} items
        - Freshest: {category} ({days} days)
        - Stalest: {category} ({days} days)

  immediate_checks:
    - name: schema_consumed_by
      description: "Every schema must declare at least one consumer at creation time — prevents orphaned schemas from requiring the 14-day staleness window"
      check: "Schema file has at least one reference from a policy, persona, or contract within the repo"
      severity: error
      timing: "On creation (immediate) — no 14-day grace period"
      mechanism: "Cross-reference scan: for each schemas/*.json, verify at least one reference exists in policies/*.yaml, personas/*.yaml, or contracts/"
      article: "Article 7 (Auditability)"
      rationale: "Injection #10 in chaos-003 demonstrated that a 14-day delay lets orphaned schemas persist undetected. Immediate cross-reference check closes this gap."

    - name: artifact_consumer_declaration
      description: "New governance artifacts (schemas, policies, grammars) must declare their consumer in metadata or front-matter"
      check: "Artifact has a consumed_by, referenced_by, or integration section"
      severity: warning
      timing: "On creation"
      mechanism: "YAML/JSON field presence check"
      article: "Article 8 (Observability)"

  anti_patterns:
    - name: "Stale staleness signal"
      description: "A signal about staleness that is itself stale"
      detection: "sig-stale-action-*.signal.json older than 3 days"
      action: "Auto-escalate — this is a meta-governance failure"

    - name: "Belief that drives action but has no refresh"
      description: "A belief cited in recent decisions but not re-evaluated"
      detection: "Belief cited in last 7 days but not updated in last 14"
      action: "Flag as high priority — decisions may be based on outdated evidence"

    - name: "PDCA stuck in Plan"
      description: "A PDCA cycle that never progressed past Plan"
      detection: "pdca.json with phase=Plan and last_updated > 14 days"
      action: "Either advance to Do or archive as abandoned"

    - name: "Course with no translations"
      description: "A course exists in English but has no translations"
      detection: "courses/{dept}/en/ has files but courses/{dept}/{lang}/ is empty"
      action: "Schedule translation via /seldon course-pipeline"

    - name: "Department with no courses"
      description: "Department has grammar and weights but no courses produced"
      detection: "departments/{dept}.department.json exists but courses/{dept}/ is empty"
      action: "Schedule /seldon research-cycle + /seldon course-pipeline"

    - name: "Grammar with no research cycles"
      description: "Grammar exists but has never been used by a research cycle"
      detection: "grammars/{name}.ebnf exists but weights metadata.cycle_count = 0"
      action: "Schedule /seldon research-cycle for the department"

integration:
  driver_recon: "Staleness scan runs in every RECON phase — stale items become tasks"
  demerzel_audit: "Level 2 audit includes staleness report"
  demerzel_report: "Daily report includes staleness summary"
  demerzel_compound: "Compound phase checks if stale items were addressed"
  conscience: "Unprocessed conscience signals trigger escalation after 3 days"

observability:
  metrics:
    - name: freshness_score
      formula: "1 - (stale_artifact_count / total_artifact_count)"
      target: "> 0.8"
      alert: "< 0.5 — governance is running on stale information"

    - name: mean_staleness_days
      formula: "average(days_since_last_update) across all state artifacts"
      target: "< 7 days"
      alert: "> 14 days — system is not self-maintaining"

    - name: critical_stale_count
      formula: "count of artifacts exceeding 2x max_staleness"
      target: 0
      alert: "> 0 — immediate action required"
