<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demerzel Mission Control</title>
<style>
body{margin:0;background:#140805;color:#fff7ed;font:15px system-ui,sans-serif}main{max-width:820px;margin:auto;padding:22px}.card{background:#24100b;border:1px solid #7c2d12;border-radius:16px;padding:16px;margin:12px 0}.mode{display:inline-block;background:#7c2d12;border:1px solid #fb923c;border-radius:999px;padding:6px 12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#160b08;border:1px solid #7c2d12;border-radius:12px;padding:10px}.metric b{display:block;font-size:24px}.muted{color:#f3b27a}.pill{display:inline-block;border:1px solid #fb923c;border-radius:999px;padding:4px 8px;margin:3px}.item{border-top:1px solid #4a1d12;padding:10px 0}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main>
<section class="card"><span class="mode" id="mode">Loading</span><h1>Demerzel Mission Control</h1><p class="muted" id="stamp">Loading mission-control.json</p><button onclick="loadStatus()">Reload snapshot</button></section>
<section class="grid" id="metrics"></section>
<section class="card"><h2>Queue</h2><div id="queue"></div></section>
<section class="card"><h2>Next safe actions</h2><pre id="actions"></pre></section>
<footer class="muted">Static page. Data comes from mission-control.json generated by GitHub Actions.</footer>
</main>
<script>
function metric(k,v){return '<div class="metric"><span class="muted">'+k+'</span><b>'+(v??'-')+'</b></div>'}
function render(j){document.getElementById('mode').textContent=j.mode||'UNKNOWN';document.getElementById('stamp').textContent='Generated: '+(j.generated_at||'unknown');let s=j.summary||{};document.getElementById('metrics').innerHTML=metric('Open PRs',s.open_prs)+metric('Draft PRs',s.draft_prs)+metric('Mergeable',s.mergeable_true)+metric('Blocked',s.mergeable_false);let q=j.queue||[];document.getElementById('queue').innerHTML=q.slice(0,10).map(r=>'<div class="item"><b>#'+r.number+' '+r.title+'</b><br><span class="pill">draft '+r.draft+'</span><span class="pill">mergeable '+r.mergeable+'</span><p class="muted">'+(r.next_action||'')+'</p></div>').join('')||'<p>No queue data.</p>';document.getElementById('actions').textContent=(j.next_safe_actions||[]).join('\n')||'No action data.'}
function loadStatus(){fetch('mission-control.json?x='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(render).catch(e=>{document.getElementById('stamp').textContent='Could not load mission-control.json: '+e.message})}
loadStatus();
</script>
</body>
</html>
