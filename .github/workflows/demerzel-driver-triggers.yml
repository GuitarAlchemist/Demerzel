name: Demerzel Driver Triggers

# RETIRED 2026-07-18 — producer for the autonomous driver (skills/demerzel-drive),
# which was superseded by the human-gated supervised loop (skills/supervised-loop).
# The driver's consume cycle was never scheduled, so these auto-fired triggers
# accumulated 594 orphans (now under state/triggers/archived/). Auto-triggers are
# disabled (workflow_dispatch-only) to stop the leak. See
# state/evolution/2026-03-20-autonomous-driver.evolution.json (event: superseded).
# To reverse the migration, restore the push/issues/workflow_run/discussion triggers
# below AND schedule the driver's consume cycle — do not restore the producer alone.
on:
  workflow_dispatch:
  # push:
  #   branches: [master, main]
  # issues:
  #   types: [opened, reopened]
  # workflow_run:
  #   workflows: ["CI", "Streeling Daily", "Demerzel Self-Improvement", "Demerzel Autofix"]
  #   types: [completed]
  # discussion:
  #   types: [created]

defaults:
  run:
    shell: bash

jobs:
  write-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pushes to master go over the write deploy key, not GITHUB_TOKEN: the
      # `risk-report` ruleset on master lists `DeployKey` as its only bypass
      # actor (the GitHub Actions integration cannot be a bypass actor here —
      # it has no org installation record). See #902.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.RULESET_BYPASS_SSH_KEY }}

      - name: Determine trigger type
        id: trigger
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "type=push" >> $GITHUB_OUTPUT
            echo "priority=medium" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "issues" ]; then
            echo "type=issue_${{ github.event.action }}" >> $GITHUB_OUTPUT
            echo "priority=medium" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" = "failure" ]; then
              echo "type=ci_failure" >> $GITHUB_OUTPUT
              echo "priority=high" >> $GITHUB_OUTPUT
            else
              exit 0
            fi
          elif [ "${{ github.event_name }}" = "discussion" ]; then
            echo "type=discussion_created" >> $GITHUB_OUTPUT
            echo "priority=low" >> $GITHUB_OUTPUT
          fi

      - name: Write trigger file
        if: steps.trigger.outputs.type != ''
        run: |
          mkdir -p state/triggers
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          TRIGGER_FILE="state/triggers/${TIMESTAMP}-${{ steps.trigger.outputs.type }}.trigger.json"
          cat > "$TRIGGER_FILE" <<EOF
          {
          "type": "${{ steps.trigger.outputs.type }}",
          "repo": "${{ github.event.repository.name }}",
          "ref": "${{ github.ref }}",
          "priority": "${{ steps.trigger.outputs.priority }}",
          "details": {
            "event": "${{ github.event_name }}",
            "sender": "${{ github.actor }}",
            "run_id": "${{ github.run_id }}"
          },
          "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Commit trigger file
        if: steps.trigger.outputs.type != ''
        run: |
          git config user.name "Demerzel"
          git config user.email "demerzel@guitaralchemist.com"
          git add state/triggers/
          git diff --cached --quiet || git commit -m "trigger: ${{ steps.trigger.outputs.type }} from ${{ github.event.repository.name }} [skip ci]"
          git pull --rebase || true
          git push
