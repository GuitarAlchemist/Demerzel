name: Demerzel Quality Trend Freshness

# Green != dead guard for the quality-trend feeder (demerzel-quality-trend.yml).
# A silent "no news" feeder is indistinguishable from a dead one — that is exactly
# how state/quality-trend/ died unnoticed for 64 days in 2026. This runs
# INDEPENDENTLY of the feeder: if the feeder stops, the newest data goes stale and
# this check turns RED, so a dead loop can no longer hide behind silence.
# Silent on green; diagnostic + RED on stale; never remediates.

on:
  schedule:
    # Weekly, Monday 13:00 UTC. Feeder is daily, so >3 days stale => the feeder died.
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MAX_STALE_DAYS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assert quality-trend freshness
        id: freshness
        run: |
          python - <<'PY'
          import glob, json, os
          from datetime import datetime, timedelta, timezone

          max_stale = int(os.environ["MAX_STALE_DAYS"])
          files = sorted(glob.glob("state/quality-trend/*.jsonl"))
          newest_ts, newest_src = None, None
          for path in files:
              with open(path, encoding="utf-8") as fh:
                  for line in fh:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          ts = json.loads(line).get("timestamp")
                      except json.JSONDecodeError:
                          continue
                      if ts:
                          dt = datetime.fromisoformat(ts.replace("Z", "+00:00"))
                          if newest_ts is None or dt > newest_ts:
                              newest_ts, newest_src = dt, path

          now = datetime.now(timezone.utc)
          alert_path = "state/quality-trend/.freshness-alert.json"

          if newest_ts is None:
              age = None
              stale = True
              reason = "no quality-trend data found at all"
          else:
              elapsed = now - newest_ts
              age = elapsed.days
              stale = elapsed > timedelta(days=max_stale)
              reason = (f"newest quality-trend row is {age}d old "
                        f"(threshold {max_stale}d) from {newest_src}")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if not stale:
              # Green: silent. Clear any prior alert (recovery).
              if os.path.exists(alert_path):
                  os.remove(alert_path)
              if summary:
                  with open(summary, "a") as fh:
                      fh.write(f"quality-trend fresh: {reason}\n")
              print(f"OK: {reason}")
              raise SystemExit(0)

          # Red: write diagnostic, will be committed + fail the check.
          diag = {
              "alert": "quality-trend-stale",
              "detected_at": now.strftime("%Y-%m-%dT%H:%M:%SZ"),
              "newest_row_age_days": age,
              "max_stale_days": max_stale,
              "reason": reason,
              "likely_cause": "the demerzel-quality-trend feeder stopped running",
          }
          with open(alert_path, "w", encoding="utf-8") as fh:
              json.dump(diag, fh, indent=2)
          if summary:
              with open(summary, "a") as fh:
                  fh.write(f"### 🔴 quality-trend STALE\n\n{reason}\n\n"
                           f"Likely cause: the feeder stopped. Check "
                           f"`demerzel-quality-trend.yml` runs.\n")
          print(f"STALE: {reason}")
          raise SystemExit(1)
          PY

      - name: Persist freshness alert state
        if: steps.freshness.outcome == 'success' || steps.freshness.outcome == 'failure'
        run: |
          git config user.name "Demerzel"
          git config user.email "demerzel@guitaralchemist.com"
          git add -A state/quality-trend/.freshness-alert.json || true
          git diff --cached --quiet || {
            if [[ -f state/quality-trend/.freshness-alert.json ]]; then
              message="alert(quality-trend): feeder stale — freshness guard tripped"
            else
              message="chore(quality-trend): clear recovered freshness alert"
            fi
            git commit -m "$message"
            git pull --rebase || true
            git push
          }
