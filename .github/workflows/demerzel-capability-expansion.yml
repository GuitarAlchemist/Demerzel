name: Demerzel Capability Expansion

on:
  schedule:
    # Run weekly on Mondays at 10:37 AM EST (15:37 UTC)
    - cron: '37 15 * * 1'
  workflow_dispatch:
    inputs:
      focus_area:
        description: 'Focus area for expansion (e.g., music-theory, ml-ops, governance, all)'
        required: false
        default: 'all'
        type: string

permissions:
  contents: read
  issues: write
  discussions: write

defaults:
  run:
    shell: bash

jobs:
  scan-capabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout Demerzel
        uses: actions/checkout@v4

      - name: Ecosystem facts
        id: eco
        uses: ./.github/actions/ecosystem

      - name: Inventory ecosystem capabilities
        id: capabilities
        run: |
          # `gh api` prints its error body to STDOUT on a missing path, and a
          # pipeline's exit status is the *last* command's — so the old
          # `gh api ... | tr ... || echo "none"` fallback could never fire, and a
          # 404 body was interpolated verbatim into the JSON below. The embedded
          # quotes then broke it ("Invalid numeric literal"), which is what took
          # out the first run that got far enough to reach step 6 (#703).
          # Capture gh's own status, and build the JSON with jq rather than by
          # string interpolation.
          repo_dir() {  # repo_dir <owner/repo> <path> <fallback> [limit]
            local out
            if out=$(gh api "repos/$1/contents/$2" --jq '.[].name' 2>/dev/null); then
              if [ -n "${4:-}" ]; then
                out=$(printf '%s\n' "$out" | head -n "$4")
              fi
              printf '%s' "$out" | paste -sd, -
            else
              printf '%s' "$3"
            fi
          }

          local_dir() {  # local_dir <glob> <basename-suffix>
            ls -d $1 2>/dev/null | xargs -I{} basename {} "$2" | paste -sd, -
          }

          # ── Demerzel capabilities (governance) ──
          DEMERZEL_SKILLS=$(local_dir '.claude/skills/*/' '')
          DEMERZEL_WORKFLOWS=$(local_dir '.github/workflows/*.yml' '.yml')
          DEMERZEL_PERSONAS=$(local_dir 'personas/*.persona.yaml' '.persona.yaml')

          # ── ix capabilities (ML/Rust) ──
          IX_CRATES=$(repo_dir GuitarAlchemist/ix crates unknown)
          IX_MCP=$(repo_dir GuitarAlchemist/ix mcp-servers none)

          # ── tars capabilities (F#/reasoning) ──
          TARS_PROJECTS=$(repo_dir GuitarAlchemist/tars src unknown)
          TARS_EXPLORATIONS=$(repo_dir GuitarAlchemist/tars v1/docs/Explorations unknown 10)

          # ── ga capabilities (C#/music) ──
          GA_PROJECTS=$(repo_dir GuitarAlchemist/ga src unknown)
          GA_MCP=$(repo_dir GuitarAlchemist/ga mcp-servers none)

          # ── MCP tools available ──
          MCP_REGISTRY=""
          if [ -f schemas/capability-registry.json ]; then
            MCP_REGISTRY=$(jq -r '(.tools // [])[].name' schemas/capability-registry.json 2>/dev/null | paste -sd, -)
          fi

          # Save capability map. jq --arg quotes every value, so no inventory
          # string can break the document no matter what the API returned.
          jq -n \
            --arg ds "$DEMERZEL_SKILLS" --arg dw "$DEMERZEL_WORKFLOWS" --arg dp "$DEMERZEL_PERSONAS" \
            --arg ic "$IX_CRATES" --arg im "$IX_MCP" \
            --arg tp "$TARS_PROJECTS" --arg te "$TARS_EXPLORATIONS" \
            --arg gp "$GA_PROJECTS" --arg gm "$GA_MCP" \
            --arg mcp "$MCP_REGISTRY" \
            '{
              demerzel: {role: "Governance coordinator", skills: $ds, workflows: $dw, personas: $dp},
              ix:       {role: "Machine forge (Rust ML)", crates: $ic, mcp_servers: $im},
              tars:     {role: "Cognition engine (F# reasoning)", projects: $tp, explorations: $te},
              ga:       {role: "Guitar Alchemist (C# music domain)", projects: $gp, mcp_servers: $gm},
              mcp_tools: $mcp
            }' > /tmp/capabilities.json

          # Fail here rather than handing malformed JSON to the model downstream.
          jq -e . /tmp/capabilities.json > /dev/null

          echo "CAPABILITIES_READY=true" >> $GITHUB_OUTPUT

      - name: Identify capability gaps and expansion opportunities
        id: analyze
        if: steps.capabilities.outputs.CAPABILITIES_READY == 'true'
        run: |
          CAPABILITIES=$(cat /tmp/capabilities.json)
          FOCUS="${{ inputs.focus_area || 'all' }}"

          # This is a scheduled producer: its whole job is to emit an expansion
          # issue. A run that cannot call the model has not "skipped" — it has
          # died, and must say so. Exiting 0 here is what let four consecutive
          # failures read as one green run and three red ones (#703).
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set; the capability scan cannot run."
            echo "ANALYSIS_READY=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Call Claude via the shared llm_call.sh seam (Candidate 3).
          LLM_SYSTEM=$(jq -rn --arg focus "$FOCUS" \
            '"You are Demerzel, governance coordinator for the GuitarAlchemist AI ecosystem.\n\nYour ecosystem:\n- **Demerzel** (this repo): governance framework — constitutions, policies, personas, skills, workflows\n- **ix**: Rust ML forge — crates for ML algorithms, optimization, GPU compute, MCP servers\n- **tars**: F# cognition — WoT DSL, symbolic reasoning, agent reflection, explorations\n- **ga**: C# Guitar Alchemist — music theory domain, MCP server with 50+ tools, chatbot\n\nYour job: identify what the ecosystem CANNOT currently do but SHOULD be able to do. Think about:\n1. Missing MCP tools/servers that would add valuable capabilities\n2. Missing skills/hooks that would improve automation\n3. Cross-repo integrations that would create synergy\n4. Knowledge gaps where no repo has expertise\n5. New repos/teams that might be needed\n\nFor each gap, specify:\n- What is missing\n- Which repo should implement it (or if a new repo is needed)\n- Priority (CRITICAL/HIGH/MEDIUM/LOW)\n- Suggested directive (what to tell the implementing repo)\n\nFocus area: " + $focus + "\n\nBe concrete and actionable. No vague suggestions."')
          PROMPT=$(jq -rn --arg caps "$CAPABILITIES" \
            '"Current ecosystem capabilities:\n\n" + $caps + "\n\nIdentify capability gaps and expansion opportunities."')
          export LLM_SYSTEM
          # if-form: the seam guarantees non-empty text on success (exit 0) or a
          # non-zero exit + stderr diagnostic on failure — no -s check needed.
          if bash .github/scripts/llm_call.sh claude "$PROMPT" 2000 > /tmp/expansion-analysis.txt 2>/tmp/llm_err; then
            echo "ANALYSIS_READY=true" >> $GITHUB_OUTPUT
          else
            # A failed call means no issue and no discussion post — the outcome
            # this workflow exists for did not happen. Fail loudly rather than
            # skipping the producing steps behind a green check.
            echo "::error::Capability analysis call failed: $(cat /tmp/llm_err)"
            echo "ANALYSIS_READY=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Create expansion issue
        if: steps.analyze.outputs.ANALYSIS_READY == 'true'
        run: |
          DATE=$(date -u +%Y-%m-%d)
          ANALYSIS=$(cat /tmp/expansion-analysis.txt)
          CAPABILITIES=$(jq '.' /tmp/capabilities.json)

          # Self-heal the label. `gh issue create --label` fails outright on a
          # label that does not exist, and this one never did — so the very first
          # run to survive the analysis step died here instead, with the reason
          # swallowed by 2>/dev/null (#703).
          gh label create capability-expansion \
            --repo GuitarAlchemist/Demerzel \
            --color 0E8A16 \
            --description "Ecosystem capability gaps identified by the expansion scanner" \
            2>/dev/null || true

          # Check for existing expansion issue
          EXISTING=$(gh issue list --repo GuitarAlchemist/Demerzel --state open --label "capability-expansion" --json number --jq 'length' || echo "0")
          if [ "$EXISTING" -gt 0 ]; then
            echo "Expansion issue already open, updating..."
            ISSUE_NUM=$(gh issue list --repo GuitarAlchemist/Demerzel --state open --label "capability-expansion" --json number --jq '.[0].number' 2>/dev/null)
            gh issue comment "$ISSUE_NUM" --repo GuitarAlchemist/Demerzel --body "## Updated Scan — ${DATE}

          ${ANALYSIS}

          ---
          *Demerzel Capability Expansion Scanner*"
            exit 0
          fi

          gh issue create --repo GuitarAlchemist/Demerzel \
            --title "Capability expansion opportunities ($DATE)" \
            --body "## Demerzel Capability Expansion — ${DATE}

          ### Current Ecosystem
          \`\`\`json
          ${CAPABILITIES}
          \`\`\`

          ### Gap Analysis & Expansion Opportunities
          ${ANALYSIS}

          ---
          *Generated by Demerzel Capability Expansion Scanner. Demerzel identifies what she doesn't know and proposes how to learn it.*" \
            --label "capability-expansion,enhancement"

      - name: Post to Discussions
        if: steps.analyze.outputs.ANALYSIS_READY == 'true'
        run: |
          DATE=$(date -u +%Y-%m-%d)
          ANALYSIS=$(cat /tmp/expansion-analysis.txt)
          BODY=$(cat <<DISCEOF
          ## 🚀 Capability Expansion Scan — ${DATE}

          Demerzel scanned the ecosystem for capability gaps and expansion opportunities.

          ${ANALYSIS}

          ---
          *Demerzel knows what she doesn't know. This scan identifies gaps across ix, tars, ga, and the governance framework itself.*
          DISCEOF
          )
          REPO_NODE_ID="${{ steps.eco.outputs.repo_node_id }}" \
            bash .github/scripts/post_discussion.sh \
              "${{ steps.eco.outputs.cat_general }}" "🚀 Capability Expansion — $DATE" "$BODY"
