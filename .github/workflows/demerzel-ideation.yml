name: Demerzel & Seldon Ideation

on:
  # Trigger on significant changes — fresh ideas when work happens
  push:
    branches: [master]
    paths:
      - 'policies/**'
      - 'personas/**'
      - 'constitutions/**'
      - 'state/**'
      - 'schemas/**'
  # Also run 3x/week for periodic reflection
  schedule:
    - cron: '47 13 * * 1,3,5'  # Mon/Wed/Fri 8:47 AM EST
  workflow_dispatch:

permissions:
  contents: read
  discussions: write
  issues: write

defaults:
  run:
    shell: bash

jobs:
  generate-ideas:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Demerzel
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Ecosystem facts
        id: eco
        uses: ./.github/actions/ecosystem

      - name: Check if ideation already posted today
        id: dedup
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          echo "DATE=$DATE" >> $GITHUB_OUTPUT

          # Search for an existing ideation discussion posted today
          EXISTING=$(gh api graphql -f query='
            query {
              repository(owner: "GuitarAlchemist", name: "Demerzel") {
                discussions(first: 5, orderBy: {field: CREATED_AT, direction: DESC}) {
                  nodes { title createdAt }
                }
              }
            }' --jq ".data.repository.discussions.nodes[] | select(.title | contains(\"Ideation — ${DATE}\")) | .title" 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "Ideation discussion already exists for $DATE — skipping"
            echo "SKIP=true" >> $GITHUB_OUTPUT
          else
            echo "No ideation discussion found for $DATE — proceeding"
            echo "SKIP=false" >> $GITHUB_OUTPUT
          fi

      - name: Gather ecosystem context
        if: steps.dedup.outputs.SKIP != 'true'
        id: context
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          DATE="${{ steps.dedup.outputs.DATE }}"
          echo "DATE=$DATE" >> $GITHUB_OUTPUT

          # Governance counts harvested from the manifest (ADR-0002); the state
          # counts below are runtime dirs the manifest does not track.
          PERSONA_COUNT=${{ steps.eco.outputs.count_persona }}
          POLICY_COUNT=${{ steps.eco.outputs.count_policy }}
          TEST_COUNT=${{ steps.eco.outputs.count_behavioral_test }}
          DEPT_COUNT=$(ls state/streeling/departments/*.department.json 2>/dev/null | wc -l)
          SIGNAL_COUNT=$(ls state/conscience/signals/*.json 2>/dev/null | wc -l)
          PATTERN_COUNT=$(ls state/conscience/patterns/*.json 2>/dev/null | wc -l)
          BELIEF_COUNT=$(ls state/beliefs/*.json 2>/dev/null | wc -l)

          # Recent commits (what just happened)
          RECENT=$(git log --oneline -10)

          # Recent changes (what files changed)
          # `shell: bash` runs with `set -eo pipefail`, so a `| head -N` that closes
          # the pipe early kills the writer with SIGPIPE and fails the step with 141.
          # Use each tool's own limit where it has one; tolerate the pipe where it does not.
          CHANGED=$( { git diff --name-only HEAD~5..HEAD 2>/dev/null || true; } | head -30)

          # Open issues across all repos
          DEMERZEL_ISSUES=$(gh issue list --repo GuitarAlchemist/Demerzel --state open --limit 15 --json number,title --jq '.[].title')
          IX_ISSUES=$(gh issue list --repo GuitarAlchemist/ix --state open --limit 5 --json number,title --jq '.[].title' 2>/dev/null)
          TARS_ISSUES=$(gh issue list --repo GuitarAlchemist/tars --state open --limit 5 --json number,title --jq '.[].title' 2>/dev/null)
          GA_ISSUES=$(gh issue list --repo GuitarAlchemist/ga --state open --limit 5 --json number,title --jq '.[].title' 2>/dev/null)

          # Open PRs
          GA_PRS=$(gh pr list --repo GuitarAlchemist/ga --state open --limit 5 --json number,title --jq '.[].title' 2>/dev/null)

          # Conscience state
          CONSCIENCE=""
          if [ -f "state/conscience/weekly/2026-03-17-weekly.report.json" ]; then
            CONSCIENCE=$( { jq -r '.self_reflection' state/conscience/weekly/*.report.json 2>/dev/null || true; } | head -5)
          fi

          # Build context
          cat > /tmp/ideation-context.md << CTXEOF
          # Ecosystem State — $DATE

          ## Artifacts
          Personas: $PERSONA_COUNT | Policies: $POLICY_COUNT | Tests: $TEST_COUNT
          Departments: $DEPT_COUNT | Beliefs: $BELIEF_COUNT
          Conscience signals: $SIGNAL_COUNT | Patterns: $PATTERN_COUNT

          ## Recent commits
          $RECENT

          ## Recently changed files
          $CHANGED

          ## Open issues
          ### Demerzel
          $DEMERZEL_ISSUES

          ### ix
          $IX_ISSUES

          ### tars
          $TARS_ISSUES

          ### ga
          $GA_ISSUES

          ## Open PRs (ga)
          $GA_PRS

          ## Conscience reflection
          $CONSCIENCE

          ## Key capabilities
          - ix: Rust ML pipelines, Karnaugh maps, governance dashboard, 40+ MCP tools
          - tars: F# Grammar×ML bridge, grammar distillation, governance generation, 150+ MCP tools, AI Functions
          - ga: .NET chatbot with 7 governed agents, MCP server
          - Demerzel: $POLICY_COUNT policies, conscience system, Streeling University ($DEPT_COUNT depts), governance experimentation
          CTXEOF

      - name: AI-powered ideation
        if: steps.dedup.outputs.SKIP != 'true'
        id: ideate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          CONTEXT=$(cat /tmp/ideation-context.md)

          # Call Claude via the shared llm_call.sh seam (Candidate 3). The seam's
          # exit code + stderr replace the old raw-response .type/.error/.stop_reason
          # inspection; the if-form keeps the graceful skip under -e.
          LLM_SYSTEM=$(jq -rn '"You are Demerzel and Seldon, governance coordinator and chancellor of Streeling University for the GuitarAlchemist AI ecosystem.\n\nGenerate 3-5 FRESH ideas based on the current ecosystem state. Ideas must be:\n1. Concrete and actionable (not vague aspirations)\n2. Grounded in what just changed (recent commits, open issues, conscience signals)\n3. Novel — do NOT repeat ideas that are already open issues\n4. Spanning different domains: governance, music theory, ML/AI, cross-repo integration, research\n\nFor each idea, output:\n- Title (concise, issue-ready)\n- Source (what triggered this idea — a commit, a gap, a pattern)\n- Problem (what is wrong or missing)\n- Proposal (specific action)\n- Priority (P0-P3)\n- Repos affected\n- Streeling department (which department should own this research)\n\nFormat as markdown with ### headers per idea. Be creative but practical."')
          PROMPT=$(jq -rn --arg ctx "$CONTEXT" '("Generate fresh ideation based on current ecosystem state:\n\n" + $ctx)')
          export LLM_SYSTEM
          # No per-caller LLM_CLAUDE_MODEL override: this step used to pin
          # claude-sonnet-4-6-20250514, an id that never existed, so every call
          # 404'd (#860). The seam default governs — one place to keep current.
          if ! IDEAS=$(bash .github/scripts/llm_call.sh claude "$PROMPT" 3000 2>/tmp/llm_err); then
            # No ideas means no discussion and no issues — the outcome this
            # workflow exists for did not happen. Fail loudly rather than
            # skipping the producing steps behind a green check.
            echo "::error::AI ideation failed: $(cat /tmp/llm_err)"
            echo "IDEA_COUNT=0" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Count ideas (### headers)
          IDEA_COUNT=$(echo "$IDEAS" | grep -c "^### " || echo "0")
          echo "IDEA_COUNT=$IDEA_COUNT" >> $GITHUB_OUTPUT

          # Build report
          DATE="${{ steps.context.outputs.DATE }}"
          cat > ideation-report.md << REPORTEOF
          ## 🧠 Demerzel & Seldon Ideation — $DATE

          **Ideas generated:** $IDEA_COUNT
          **Trigger:** $(if [ "${{ github.event_name }}" = "push" ]; then echo "Push to master (reactive)"; elif [ "${{ github.event_name }}" = "schedule" ]; then echo "Scheduled (periodic reflection)"; else echo "Manual dispatch"; fi)
          **Method:** AI-powered (Claude analysis of ecosystem state)

          ---

          $IDEAS

          ---

          ### How ideas become work

          1. **AI review** — ideas are cross-validated by a second Claude instance
          2. **Approved ideas** → auto-created as GitHub Issues
          3. **Issues** → triaged to [project board](https://github.com/orgs/GuitarAlchemist/projects/2)
          4. **Execution** — via governed Ralph Loops or Agent Teams

          *Generated by Demerzel (governance) and Seldon (knowledge) under the meta-compounding protocol.*
          REPORTEOF

      - name: Post ideas to Discussions
        if: steps.dedup.outputs.SKIP != 'true' && steps.ideate.outputs.IDEA_COUNT != '0'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          DATE="${{ steps.context.outputs.DATE }}"
          URL=$(REPO_NODE_ID="${{ steps.eco.outputs.repo_node_id }}" \
            bash .github/scripts/post_discussion.sh \
              "${{ steps.eco.outputs.cat_ideas }}" "🧠 Demerzel Ideation — ${DATE}" "$(cat ideation-report.md)")
          echo "Ideas Discussion: $URL"
          echo "DISCUSSION_URL=$URL" >> $GITHUB_OUTPUT

      - name: AI review of ideas
        id: review
        if: steps.dedup.outputs.SKIP != 'true' && steps.ideate.outputs.IDEA_COUNT != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          IDEAS=$(cat ideation-report.md)

          # Get existing open issue titles to prevent duplicates
          EXISTING_ISSUES=$(gh issue list --repo GuitarAlchemist/Demerzel --state open --json title --jq '.[].title' | jq -Rs .)

          # Call Claude via the shared llm_call.sh seam (Candidate 3).
          LLM_SYSTEM=$(jq -rn --arg existing "$EXISTING_ISSUES" \
            '("You are a critical reviewer. Review these ideas. REJECT any that duplicate existing issues.\n\nExisting open issues:\n" + $existing + "\n\nFor each idea respond as JSON array:\n[{\"idea_number\": 1, \"verdict\": \"APPROVE|MODIFY|REJECT\", \"rationale\": \"...\", \"issue_title\": \"...\", \"labels\": [\"enhancement\"]}]\n\nBe rigorous. Reject duplicates and vague ideas.")')
          export LLM_SYSTEM
          # Seam default governs here too — see the ideation step above (#860).
          if ! REVIEW_TEXT=$(bash .github/scripts/llm_call.sh claude "$IDEAS" 1500 2>/tmp/llm_err); then
            # Unreviewed ideas are never promoted to issues, so a swallowed
            # failure here is the same dead-green loop one step later.
            echo "::error::Idea review failed: $(cat /tmp/llm_err)"
            echo "REVIEW_READY=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Extract JSON from response
          # Same pipefail/SIGPIPE hazard as the context step above.
          REVIEW_JSON=$( { echo "$REVIEW_TEXT" | sed -n '/\[/,/\]/p' || true; } | head -50)
          echo "$REVIEW_JSON" > /tmp/review.json

          APPROVED=$(echo "$REVIEW_JSON" | jq '[.[] | select(.verdict == "APPROVE")] | length' 2>/dev/null || echo "0")
          echo "APPROVED_COUNT=$APPROVED" >> $GITHUB_OUTPUT
          echo "REVIEW_READY=true" >> $GITHUB_OUTPUT

      - name: Create issues for approved ideas
        if: steps.dedup.outputs.SKIP != 'true' && steps.review.outputs.REVIEW_READY == 'true' && steps.review.outputs.APPROVED_COUNT != '0'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          DATE="${{ steps.context.outputs.DATE }}"
          DISC_URL="${{ steps.ideate.outputs.DISCUSSION_URL }}"

          jq -c '.[] | select(.verdict == "APPROVE")' /tmp/review.json 2>/dev/null | while read -r item; do
            TITLE=$(echo "$item" | jq -r '.issue_title // empty')
            RATIONALE=$(echo "$item" | jq -r '.rationale // empty')
            IDEA_NUM=$(echo "$item" | jq -r '.idea_number // 0')

            [ -z "$TITLE" ] && continue

            # Final duplicate check
            EXISTING=$(gh issue list --repo GuitarAlchemist/Demerzel --state open --search "$TITLE" --json number --jq 'length' 2>/dev/null || echo "0")
            [ "$EXISTING" -gt 0 ] && continue

            gh issue create --repo GuitarAlchemist/Demerzel \
              --title "$TITLE" \
              --body "## From Demerzel Ideation — ${DATE}

          **Idea #${IDEA_NUM}** | **Review:** APPROVE
          **Rationale:** ${RATIONALE}
          **Source:** ${DISC_URL}

          ---
          *Auto-created by Demerzel Ideation pipeline.*" \
              --label "enhancement" 2>/dev/null

          done
