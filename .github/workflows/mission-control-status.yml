name: Mission Control Status

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate status JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p docs/status
          python tools/demerzel_mission_control.py --repo GuitarAlchemist/Demerzel --format json > docs/status/mission-control.json
      - name: Upload status snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mission-control-status
          path: docs/status/mission-control.json
