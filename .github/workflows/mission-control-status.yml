name: Mission Control Status

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate status JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p docs/status
          python tools/demerzel_mission_control.py --repo GuitarAlchemist/Demerzel --format json > docs/status/mission-control.json
      - name: Commit status snapshot
        run: |
          if git diff --quiet -- docs/status/mission-control.json; then
            echo "No status change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status/mission-control.json
          git commit -m "Update Mission Control status"
          git push
