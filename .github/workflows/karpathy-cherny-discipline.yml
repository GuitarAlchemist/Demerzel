name: Karpathy/Cherny Discipline Check

on:
  pull_request:
    paths:
      - 'docs/contracts/digest-schema.json'
      - 'docs/contracts/pr-rationale-schema.json'
      - 'state/digests/**'
      - '.claude/settings.json'
      - '.claude/skills/digest/**'
      - '.claude/skills/correct/**'
      - '.claude/hooks/**'
      - 'scripts/claudehooks/**'
      - 'tests/powershell/**'
      - 'CLAUDE.md'
      - '.github/workflows/karpathy-cherny-discipline.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install validators
        run: pip install jsonschema pyyaml

      - name: Verify digest schema is well-formed JSON
        run: python -c "import json; json.load(open('docs/contracts/digest-schema.json'))"

      - name: Verify CLAUDE.md contains Karpathy 4 Rules section
        run: |
          if ! grep -q "Karpathy 4 Rules" CLAUDE.md; then
            echo "::error file=CLAUDE.md::CLAUDE.md must contain a 'Karpathy 4 Rules' section."
            exit 1
          fi

      # DigestState.psm1 is no longer a hook: the /digest skill writes through it (Write-Digest),
      # and digest-validate.ps1 validates a digest by hand. The hooks are scripts/claudehooks.
      - name: Verify the /digest skill's module exists
        shell: bash
        run: |
          missing=0
          for f in ".claude/hooks/DigestState.psm1" ".claude/hooks/digest-validate.ps1"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required digest module missing: $f"
              missing=1
            fi
          done
          exit $missing

      # The hooks are one Go program, scripts/claudehooks (demerzel-hooks <hook>): no shell in hooks
      # (the user's rule, 2026-11-05). Mirrors tars's and ix's go/claudehooks.
      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/claudehooks/go.mod
          cache: false

      - name: Vet and test the hooks (scripts/claudehooks)
        working-directory: scripts/claudehooks
        env:
          GOPROXY: 'off'
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: Verify every hook is wired to demerzel-hooks, none to a shell or a script
        shell: bash
        run: |
          fail=0
          commands=$(jq -r '.hooks[][].hooks[].command' .claude/settings.json)
          for h in precompact-digest digest-staleness-nudge correction-detector digest-activity-tracker pr-rationale-capture digest-stop-finalize; do
            if ! grep -qxF "\"\$CLAUDE_PROJECT_DIR/.claude/hooks/bin/demerzel-hooks\" $h" <<<"$commands"; then
              echo "::error file=.claude/settings.json::hook $h is not wired to demerzel-hooks"
              fail=1
            fi
          done
          if ! grep -qxF 'go -C "$CLAUDE_PROJECT_DIR/scripts/claudehooks" run ./cmd/demerzel-hooks session-start' <<<"$commands"; then
            echo "::error file=.claude/settings.json::session-start (digest injection, binary install) is not wired"
            fail=1
          fi
          # EXEMPT, pending its owner: Gaia's bus client (scripts/gaia_hook.py) belongs to the Gaia
          # lane, which will port it. Exactly these six commands are exempt; any other shell or
          # script hook, a gaia_hook.py variant included, fails.
          gaia_exempt='python $CLAUDE_PROJECT_DIR/scripts/gaia_hook.py SessionStart
          python $CLAUDE_PROJECT_DIR/scripts/gaia_hook.py UserPromptSubmit
          python $CLAUDE_PROJECT_DIR/scripts/gaia_hook.py ToolActivity
          python $CLAUDE_PROJECT_DIR/scripts/gaia_hook.py PreToolUse
          python $CLAUDE_PROJECT_DIR/scripts/gaia_hook.py SessionEnd
          python $CLAUDE_PROJECT_DIR/scripts/gaia_hook.py PostToolUse'
          gaia_exempt=$(sed 's/^ *//' <<<"$gaia_exempt")
          shelled=$(grep -vxF -f <(printf '%s\n' "$gaia_exempt") <<<"$commands" \
            | grep -Ei '\b(bash|sh|zsh|pwsh|powershell|python3?|py|node|deno|bun)\b|\.(sh|bash|ps1|psm1|py|js|mjs|cmd|bat)\b' || true)
          if [ -n "$shelled" ]; then
            echo "::error file=.claude/settings.json::a hook runs a shell or a script; hooks are Go only (scripts/claudehooks): $shelled"
            fail=1
          fi
          exit $fail

      - name: Verify .claude/settings.json is valid JSON
        run: python -c "import json; json.load(open('.claude/settings.json'))"

      - name: Verify required skills exist
        shell: bash
        run: |
          missing=0
          for f in ".claude/skills/digest/SKILL.md" ".claude/skills/correct/SKILL.md"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required skill missing: $f"
              missing=1
            fi
          done
          exit $missing

      - name: Validate any committed digest archives against schema
        run: |
          python <<'PYEOF'
          import json, glob, re, sys, os
          import yaml
          from jsonschema import validate, ValidationError

          if not os.path.exists('docs/contracts/digest-schema.json'):
              sys.exit(0)
          with open('docs/contracts/digest-schema.json') as f:
              schema = json.load(f)
          errors = []
          for path in glob.glob('state/digests/archive/*.md'):
              with open(path) as f:
                  content = f.read()
              m = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
              if not m: continue
              try:
                  fm = yaml.safe_load(m.group(1))
                  validate(instance=fm, schema=schema)
              except (ValidationError, yaml.YAMLError) as e:
                  errors.append(f"{path}: {e}")
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All committed digests valid (or none committed).')
          PYEOF

  pester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run DigestState Pester tests
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.0.0 -Force
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests/powershell'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
