name: Demerzel Quality Trend

# Feeder for state/quality-trend/ — the `do` phase of skills/demerzel-quality-trend.
# Deterministic per-artifact health deltas from state/evolution/*.evolution.json.
# Revived 2026-07-18 after the loop died 2026-05 (no scheduled feeder existed).
# Paired with demerzel-quality-trend-freshness.yml, which goes RED if this stops.

on:
  schedule:
    # Daily 08:00 America/New_York (12:00 UTC during EDT). Nightly, cheap (<5s).
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: quality-trend
  cancel-in-progress: false

jobs:
  emit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pushes to master go over the write deploy key, not GITHUB_TOKEN: the
      # `risk-report` ruleset on master lists `DeployKey` as its only bypass
      # actor (the GitHub Actions integration cannot be a bypass actor here —
      # it has no org installation record). See #902.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.RULESET_BYPASS_SSH_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Emit quality-trend deltas
        run: python scripts/quality_trend.py

      - name: Commit
        run: |
          git config user.name "Demerzel"
          git config user.email "demerzel@guitaralchemist.com"
          git add state/quality-trend/
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "chore(quality-trend): nightly deltas $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase || true
          git push
