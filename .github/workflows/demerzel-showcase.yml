name: Demerzel Show & Tell

on:
  schedule:
    # Every other Monday at 9:07 AM EST (14:07 UTC) — biweekly
    - cron: '7 14 1-7,15-21 * 1'
  workflow_dispatch:

permissions:
  contents: read
  discussions: write

defaults:
  run:
    shell: bash

jobs:
  create-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Demerzel
        uses: actions/checkout@v4

      - name: Ecosystem facts
        id: eco
        uses: ./.github/actions/ecosystem

      - name: Generate showcase content
        id: showcase
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: bash .github/scripts/showcase-generate.sh
      - name: Post to Show and Tell
        if: steps.showcase.outputs.HAS_SHOWCASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          TITLE="${{ steps.showcase.outputs.SHOWCASE_TITLE }}"
          BODY=$(cat showcase.md | jq -Rs .)

          URL=$(gh api graphql -f query="mutation {
            createDiscussion(input: {
              repositoryId: \"${{ steps.eco.outputs.repo_node_id }}\",
              categoryId: \"${{ steps.eco.outputs.cat_show_and_tell }}\",
              title: \"$TITLE\",
              body: $BODY
            }) {
              discussion { url }
            }
          }" --jq '.data.createDiscussion.discussion.url' 2>/dev/null || echo "Failed to post showcase")
          echo "Showcase: $URL"
