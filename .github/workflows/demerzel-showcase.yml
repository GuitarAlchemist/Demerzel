name: Demerzel Show & Tell

on:
  schedule:
    # Every other Monday at 9:07 AM EST (14:07 UTC) — biweekly
    - cron: '7 14 1-7,15-21 * 1'
  workflow_dispatch:

permissions:
  contents: read
  discussions: write

defaults:
  run:
    shell: bash

jobs:
  create-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Demerzel
        uses: actions/checkout@v4

      - name: Ecosystem facts
        id: eco
        uses: ./.github/actions/ecosystem

      - name: Generate showcase content
        id: showcase
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: bash .github/scripts/showcase-generate.sh
      - name: Post to Show and Tell
        if: steps.showcase.outputs.HAS_SHOWCASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          TITLE="${{ steps.showcase.outputs.SHOWCASE_TITLE }}"
          # post_discussion.sh raises on failure (no silent "Failed" swallow).
          URL=$(REPO_NODE_ID="${{ steps.eco.outputs.repo_node_id }}" \
            bash .github/scripts/post_discussion.sh \
              "${{ steps.eco.outputs.cat_show_and_tell }}" "$TITLE" "$(cat showcase.md)")
          echo "Showcase: $URL"
