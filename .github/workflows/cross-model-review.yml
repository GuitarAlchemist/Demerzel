name: Cross-Model Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  detect-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check diff size and file types
        id: gate
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          # Count changed lines (additions + deletions)
          LINES_CHANGED=$(git diff --stat "$BASE"..."$HEAD" | tail -1 | grep -oP '\d+ insertion' | grep -oP '^\d+' || echo 0)
          LINES_DELETED=$(git diff --stat "$BASE"..."$HEAD" | tail -1 | grep -oP '\d+ deletion' | grep -oP '^\d+' || echo 0)
          TOTAL=$((LINES_CHANGED + LINES_DELETED))
          echo "lines_changed=$TOTAL" >> "$GITHUB_OUTPUT"

          # Check if only markdown files changed (cost control)
          NON_MD=$(git diff --name-only "$BASE"..."$HEAD" | grep -v '\.md$' | head -1 || true)
          if [ -z "$NON_MD" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if docs-only or < 10 lines
        if: steps.gate.outputs.docs_only == 'true' || steps.gate.outputs.lines_changed < 10
        run: |
          echo "Skipping review: docs_only=${{ steps.gate.outputs.docs_only }}, lines=${{ steps.gate.outputs.lines_changed }}"
          echo "SKIP_REVIEW=true" >> "$GITHUB_ENV"

      - name: Detect author model
        if: env.SKIP_REVIEW != 'true'
        id: detect
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          COMMITS=$(git log --format="%b" "$BASE"..."$HEAD")

          AUTHOR="human"

          # Check PR labels first
          if echo "$LABELS" | grep -qi "claude"; then
            AUTHOR="claude"
          elif echo "$LABELS" | grep -qi "gemini"; then
            AUTHOR="gemini"
          elif echo "$LABELS" | grep -qi "codex"; then
            AUTHOR="codex"
          # Fall back to commit message signatures
          elif echo "$COMMITS" | grep -qi "co-authored-by.*anthropic\|claude"; then
            AUTHOR="claude"
          elif echo "$COMMITS" | grep -qi "co-authored-by.*google\|gemini"; then
            AUTHOR="gemini"
          elif echo "$COMMITS" | grep -qi "co-authored-by.*openai\|codex"; then
            AUTHOR="codex"
          fi

          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"
          echo "Detected author model: $AUTHOR"

      - name: Select reviewer model
        if: env.SKIP_REVIEW != 'true'
        id: reviewer
        run: |
          AUTHOR="${{ steps.detect.outputs.author }}"

          # No model reviews its own work
          case "$AUTHOR" in
            claude)
              # Prefer Gemini for Claude-authored PRs
              if [ -n "${{ secrets.GOOGLE_AI_KEY }}" ]; then
                REVIEWER="gemini"
              else
                REVIEWER="codex"
              fi
              ;;
            gemini)
              if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
                REVIEWER="claude"
              else
                REVIEWER="codex"
              fi
              ;;
            codex)
              if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
                REVIEWER="claude"
              else
                REVIEWER="gemini"
              fi
              ;;
            human)
              # Any model can review human work; prefer Claude
              if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
                REVIEWER="claude"
              elif [ -n "${{ secrets.GOOGLE_AI_KEY }}" ]; then
                REVIEWER="gemini"
              else
                REVIEWER="codex"
              fi
              ;;
          esac

          echo "reviewer=$REVIEWER" >> "$GITHUB_OUTPUT"
          echo "Selected reviewer: $REVIEWER (author was $AUTHOR)"

      - name: Generate diff for review
        if: env.SKIP_REVIEW != 'true'
        id: diff
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          # Truncate diff to 12000 chars to stay within API limits.
          # `|| true` guards against SIGPIPE (exit 141) when `head` closes the
          # pipe early under `set -o pipefail` — same guard as the detect step.
          git diff "$BASE"..."$HEAD" | head -c 12000 > /tmp/pr_diff.txt || true
          echo "diff_file=/tmp/pr_diff.txt" >> "$GITHUB_OUTPUT"

      - name: Build review prompt
        if: env.SKIP_REVIEW != 'true'
        run: |
          cat > /tmp/review_prompt.txt << 'PROMPT_EOF'
          You are a cross-model code reviewer for the Demerzel governance framework.
          Review this pull request diff for:

          1. CORRECTNESS: Logic errors, off-by-one, missing edge cases
          2. SECURITY (OWASP): Injection risks, secrets exposure, insecure defaults
          3. ANTI-SLOP: Vague variable names, cargo-cult patterns, unnecessary complexity
          4. LOLLI DETECTION: Does this create artifacts without named consumers? Does it add governance weight without proportional value?
          5. CONSTITUTIONAL COMPLIANCE: Check against Demerzel's 11-article constitution — especially Article 4 (Proportionality), Article 3 (Reversibility), Article 9 (Bounded Autonomy)

          You are NOT told who or what authored this diff. Author identity is not
          evidence — judge the diff on its content alone.

          Output format — use exactly this structure:
          ## Cross-Model Review

          ### Findings
          - [CATEGORY] Finding description

          ### Verdict
          APPROVE or REQUEST_CHANGES with one-line rationale

          If no issues found, output APPROVE with a brief confirmation.
          Do NOT pad the review with filler praise. Be direct.

          DIFF:
          PROMPT_EOF

          # Append the actual diff.
          # Deliberately NO author/reviewer identity in the prompt: judges shift
          # verdicts on author-model labels alone (self-enhancement bias,
          # arXiv:2604.16790). Author detection is used only to SELECT the
          # reviewer; attribution is appended to the posted comment AFTER the
          # verdict, in the "Post review to PR" step.
          cat /tmp/pr_diff.txt >> /tmp/review_prompt.txt

      - name: Run Claude review
        if: env.SKIP_REVIEW != 'true' && steps.reviewer.outputs.reviewer == 'claude'
        id: claude_review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # A failed review must not masquerade as a review. The previous form
          # (`|| echo <placeholder> > /tmp/review_result.txt`) discarded
          # llm_call's stderr, wrote that placeholder into the review body,
          # and exited 0 -- so an absent OPENAI_API_KEY and a retired
          # model id both read as green runs for a week while every PR went
          # unreviewed. Surface the real diagnostic and let the run go red.
          # rc carries llm_call's classification: 2 usage, 3 API/transport,
          # 4 empty/blocked response.
          rc=0
          bash .github/scripts/llm_call.sh claude "$(cat /tmp/review_prompt.txt)" 2048 \
            > /tmp/review_result.txt 2> /tmp/review_error.txt || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Claude review failed (llm_call exit $rc): $(tr '\n' ' ' < /tmp/review_error.txt)"
            exit "$rc"
          fi

      - name: Run Gemini review
        if: env.SKIP_REVIEW != 'true' && steps.reviewer.outputs.reviewer == 'gemini'
        id: gemini_review
        env:
          GEMINI_API_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          LLM_GEMINI_MODEL: gemini-2.5-flash
        run: |
          # NOTE: GOOGLE_AI_KEY is not currently set on this repo, so this step
          # fails every time gemini is selected. That is now visible instead of
          # silent -- deliberately left in rotation per owner decision; add the
          # secret or drop gemini from "Select reviewer model" to resolve.
          rc=0
          bash .github/scripts/llm_call.sh gemini "$(cat /tmp/review_prompt.txt)" 2048 \
            > /tmp/review_result.txt 2> /tmp/review_error.txt || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Gemini review failed (llm_call exit $rc): $(tr '\n' ' ' < /tmp/review_error.txt)"
            exit "$rc"
          fi

      - name: Run Codex review
        if: env.SKIP_REVIEW != 'true' && steps.reviewer.outputs.reviewer == 'codex'
        id: codex_review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          rc=0
          bash .github/scripts/llm_call.sh codex "$(cat /tmp/review_prompt.txt)" 2048 \
            > /tmp/review_result.txt 2> /tmp/review_error.txt || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Codex review failed (llm_call exit $rc): $(tr '\n' ' ' < /tmp/review_error.txt)"
            exit "$rc"
          fi

      - name: Post review to PR
        if: env.SKIP_REVIEW != 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          REVIEW=$(cat /tmp/review_result.txt)
          REVIEWER="${{ steps.reviewer.outputs.reviewer }}"
          AUTHOR="${{ steps.detect.outputs.author }}"

          # Determine review event based on verdict
          if echo "$REVIEW" | grep -q "REQUEST_CHANGES"; then
            EVENT="REQUEST_CHANGES"
          else
            EVENT="COMMENT"
          fi

          REVIEW_FLAG="$(echo $EVENT | tr '[:upper:]' '[:lower:]' | tr '_' '-')"
          BODY="$(cat <<EOF
          $REVIEW

          ---
          *Cross-model review: $AUTHOR-authored PR reviewed by $REVIEWER*
          *Policy: [cross-model-review](../blob/master/policies/) | [anti-lolli-inflation](../blob/master/policies/anti-lolli-inflation-policy.yaml)*
          EOF
          )"

          if ! gh pr review ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --"$REVIEW_FLAG" \
            --body "$BODY"; then
            if [ "$EVENT" = "REQUEST_CHANGES" ]; then
              gh pr review ${{ github.event.pull_request.number }} \
                --repo ${{ github.repository }} \
                --comment \
                --body "$BODY

          Note: GitHub rejected a formal request-changes review for this actor, so this was posted as a comment."
            else
              exit 1
            fi
          fi
