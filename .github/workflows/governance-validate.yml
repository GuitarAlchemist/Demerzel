name: Governance Validate

on:
  push:
    paths:
      - 'logic/governance-evolution.schema.json'
      - 'state/evolution/**'
      - 'personas/**'
      - 'tests/behavioral/**'
      - 'scripts/validate_governance.py'
      - '.github/workflows/governance-validate.yml'
  pull_request:
    paths:
      - 'logic/governance-evolution.schema.json'
      - 'state/evolution/**'
      - 'personas/**'
      - 'tests/behavioral/**'
      - 'scripts/validate_governance.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run governance validator
        run: python scripts/validate_governance.py
