name: Governance Validate

on:
  push:
    paths:
      - 'logic/governance-evolution.schema.json'
      - 'state/beliefs/**'
      - 'state/evolution/**'
      - 'constitutions/**'
      - 'personas/**'
      - 'policies/**'
      - 'schemas/**'
      - 'tests/behavioral/**'
      - 'README.md'
      - 'governance-manifest.json'
      - 'scripts/**'
      - 'baml_src/**'
      - 'baml_client/**'
      - '.github/loop-health.yml'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/workflows/governance-validate.yml'
  pull_request:
    paths:
      - 'logic/governance-evolution.schema.json'
      - 'state/beliefs/**'
      - 'state/evolution/**'
      - 'constitutions/**'
      - 'personas/**'
      - 'policies/**'
      - 'schemas/**'
      - 'tests/behavioral/**'
      - 'README.md'
      - 'governance-manifest.json'
      - 'scripts/**'
      - '.github/loop-health.yml'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # jsonschema powers the compliance-report contract-instance gate
      # (galactic-protocol.md v1.3.0); the validator degrades to a printed
      # skip without it, so install it to keep the gate real.
      - name: Install deps
        run: pip install jsonschema

      - name: Run governance validator
        run: python scripts/validate_governance.py

  # belief-currency-policy 1.1.0 enforcement: the policy's staleness and
  # contradiction rules were declaration-only until 2026-07-20, when a
  # machine replay found a belief held T@0.8 for four months alongside
  # its own contradicting evidence. This lint is the tripwire; the
  # monthly substrate replay (hari) is the deeper audit.
  beliefs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Belief-currency lint
        run: python scripts/belief_lint.py

  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyyaml jsonschema

      # Generation validates inside (dangling edges, count drift, schema
      # violations, precedence disagreement) and exits non-zero on any.
      - name: Build governance manifest
        run: python scripts/build_manifest.py

      # The manifest is derived (ADR-0001): if regenerating changes the
      # committed file, it was stale. Fail and tell the author to regenerate.
      - name: Manifest must be up to date
        run: |
          if ! git diff --exit-code governance-manifest.json; then
            echo "::error::governance-manifest.json is stale. Run: python scripts/build_manifest.py"
            exit 1
          fi

  # ADR-0005 §Decision.4 — baml_client/ is committed but DERIVED, so it can fall out of
  # step with baml_src/. The check itself is not new: scripts/verify.ps1 has had it since
  # ADR-0005, and its comment said "that only stays honest if CI diffs them". CI did not —
  # no workflow invoked verify.ps1, and 23 generated files reached master stale behind
  # that gap before anyone noticed (#919). This job is the missing caller.
  #
  # Same discipline, and deliberately the same shape, as "Manifest must be up to date"
  # above: regenerate the derived artifact, fail if the committed copy differs.
  baml-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The BAML generator ships as an npm package; the version is pinned inside
      # check_baml_drift.ps1, read from baml_src/baml_project.baml.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # pwsh is preinstalled on ubuntu-latest runners. The check is PowerShell because it
      # already existed as PowerShell — porting it to bash would fork the logic, which is
      # the failure this issue is about.
      - name: BAML client must be up to date
        shell: pwsh
        run: ./scripts/check_baml_drift.ps1

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # jsonschema enables the validate()/write_artifact() seam in demerzel_kit;
      # without it those tests skip rather than fail (graceful degradation).
      # pyyaml is required by test_ecosystem_freshness (registry parsing).
      - name: Install deps
        run: pip install jsonschema pyyaml

      # The scripts/ emitters are the operational code; demerzel_kit makes their
      # gh/filesystem calls an injectable seam so convene() et al. are testable
      # without the network. Run the whole unittest suite.
      - name: Run scripts/ unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
